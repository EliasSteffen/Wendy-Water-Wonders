<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wendy's Early Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css">
<script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --ink: #1d2327; --soft: #5b6670; --rule: #d9dee2; --paper: #ffffff; --wash: #f2f4f5;
    --red: #d1242f; --yellow: #e3b008; --yellow-text: #8a6100;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 380px; height: 100%; }
  .mapwrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  aside { overflow-y: auto; padding: 22px 24px 18px; border-left: 1px solid var(--rule); display: flex; flex-direction: column; }

  h1 { font-size: 15px; font-weight: 700; margin: 0; color: var(--soft); }
  .headline { font-size: 24px; line-height: 1.2; font-weight: 700; margin: 6px 0 4px; }
  .station { margin: 0; color: var(--soft); font-size: 15px; }
  .station.off { color: var(--red); }

  section { padding: 14px 0; border-top: 1px solid var(--rule); }
  header { padding-bottom: 14px; }

  /* points that need attention */
  .row { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: baseline; width: 100%;
         padding: 7px 8px; margin: 0 -8px; border: 0; background: none; font: inherit; color: inherit; text-align: left;
         cursor: pointer; border-radius: 4px; }
  .row:hover, .row.sel { background: var(--wash); }
  .row b { font-size: 16px; }
  .row span.why { display: block; color: var(--soft); font-size: 14px; }
  .row .ppl { color: var(--soft); font-size: 14px; }
  .mark { width: 12px; height: 12px; border-radius: 2px; align-self: center; }
  .mark.red { background: var(--red); } .mark.yellow { background: var(--yellow); }
  .mark.ring { border: 3px solid var(--yellow); border-radius: 50%; }
  .empty { color: var(--soft); margin: 0; }
  .next { margin: 12px 0 0; font-size: 14px; color: var(--soft); }
  .next b { color: var(--ink); font-weight: 400; }

  /* selected point */
  .title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .title h2 { font-size: 21px; margin: 0; }
  .live { font-size: 13px; font-weight: 700; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: 3px; }
  .status { font-weight: 700; white-space: nowrap; }
  .status.red { color: var(--red); } .status.yellow { color: var(--yellow-text); } .status.none { color: var(--soft); }
  .sub { color: var(--soft); font-size: 14px; margin: 2px 0 14px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 0 12px; }
  .facts div { display: flex; flex-direction: column-reverse; }
  .facts dd { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.1; }
  .facts dt { font-size: 13px; color: var(--soft); }
  .facts dd.rising { color: var(--red); }
  .chartbox { position: relative; height: 110px; margin-bottom: 10px; }
  .advice { margin: 0; padding-left: 18px; font-size: 15px; }
  .advice li + li { margin-top: 3px; }
  .alt { margin: 10px 0 0; font-size: 15px; }

  .confirm { display: grid; gap: 6px; margin-bottom: 10px; font-size: 14px; }
  .confirm[hidden] { display: none; }
  .confirm input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 3px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button.act { font: inherit; font-size: 15px; padding: 6px 12px; border-radius: 3px; cursor: pointer;
               border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); }
  button.act:hover { background: var(--wash); }
  button.act.yellow { border-color: var(--yellow); }
  button.act.red { border-color: var(--red); color: var(--red); }
  .msg { min-height: 1.4em; margin: 6px 0 8px; font-size: 14px; color: var(--soft); }

  footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between;
           align-items: center; gap: 12px; font-size: 13px; color: var(--soft); }
  .link { font: inherit; border: 0; background: none; color: var(--soft); text-decoration: underline; cursor: pointer; padding: 0; }
  .link:hover { color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* legend on the map */
  .legend { position: absolute; left: 10px; bottom: 10px; background: var(--paper); border-radius: 3px; padding: 7px 10px;
            display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; max-width: calc(100% - 20px); }
  .legend i { display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px; border-radius: 50%; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    .mapwrap { height: 55vh; }
    aside { border-left: 0; padding: 18px 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap">
    <div id="map" aria-label="Map of the water points"></div>
    <div class="legend">
      <span><i style="background:var(--red)"></i>Warning</span>
      <span><i style="background:var(--yellow)"></i>Watch</span>
      <span><i style="background:#fff;border:2px solid var(--ink)"></i>No anomaly measured</span>
      <span><i style="border:3px solid var(--yellow)"></i>Likely to get worse</span>
    </div>
  </div>

  <aside>
    <header>
      <h1>Wendy's Early Signal, Turkana</h1>
      <p class="headline" id="headline">Loading…</p>
      <p class="station" id="station"></p>
    </header>

    <section aria-label="Water points that need attention">
      <div id="list"></div>
      <p class="next" id="next"></p>
    </section>

    <section id="detail" aria-live="polite">
      <div class="title">
        <h2 id="d-name">–</h2>
        <span class="status" id="d-status"></span>
      </div>
      <p class="sub" id="d-sub"></p>
      <dl class="facts">
        <div><dt>Salt, mg/L</dt><dd id="d-tds">–</dd></div>
        <div><dt>Germ risk</dt><dd id="d-germ">–</dd></div>
        <div><dt>People</dt><dd id="d-people">–</dd></div>
      </dl>
      <div class="confirm" id="d-confirm" hidden>
        <input type="text" id="d-by" placeholder="Your name (to switch the station lights off)" maxlength="40" aria-label="Your name">
        <label><input type="checkbox" id="d-checked"> I checked the water myself</label>
      </div>
      <div class="actions">
        <button class="act yellow" data-level="yellow">Set yellow</button>
        <button class="act red" data-level="red">Set red</button>
        <button class="act" id="d-reset">Reset</button>
      </div>
      <p class="msg" id="d-msg" role="status"></p>
      <div class="chartbox"><canvas id="chart" aria-label="Salt over time"></canvas></div>
      <ul class="advice" id="d-advice"></ul>
      <p class="alt" id="d-alt" hidden></p>

    </section>

    <footer>
      <span id="updated"></span>
      <button class="link" id="reset-all">Reset all points</button>
    </footer>
  </aside>
</div>

<script>
const COLOR = { red: '#d1242f', yellow: '#e3b008', none: '#ffffff' };
const STATUS = { red: 'Warning', yellow: 'Watch', none: 'No anomaly measured' };
const RANK = { red: 2, yellow: 1, none: 0 };
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const n = v => v.toLocaleString('en');
const ago = h => h == null ? 'never' : h <= 0.2 ? 'just now' : h < 1 ? `${Math.round(h * 60)} min ago` : `${h} h ago`;

let data = null, selectedId = null, source = null, selLayer = null, chart = null;

const map = new atlas.Map('map', {
  center: [35.62, 3.14], zoom: 9.4, style: 'satellite_road_labels',
  authOptions: { authType: 'subscriptionKey', subscriptionKey: '__MAPS_KEY__' }
});

map.events.add('ready', () => {
  source = new atlas.source.DataSource();
  map.sources.add(source);
  const isPoint = ['==', ['geometry-type'], 'Point'];
  map.layers.add(new atlas.layer.LineLayer(source, null, {
    strokeColor: '#ffffff', strokeWidth: 2.5, strokeDashArray: [2, 2], filter: ['==', ['geometry-type'], 'LineString']
  }));
  map.layers.add(new atlas.layer.BubbleLayer(source, null, {   // likely to get worse (forecast)
    color: 'rgba(0,0,0,0)', radius: 17, strokeWidth: 3, strokeColor: '#e3b008',
    filter: ['all', isPoint, ['==', ['get', 'outlook_level'], 'red']]
  }));
  selLayer = new atlas.layer.BubbleLayer(source, null, {
    color: 'rgba(255,255,255,0.3)', radius: 23, strokeWidth: 2, strokeColor: '#ffffff',
    filter: ['all', isPoint, ['==', ['get', 'id'], '']]
  });
  map.layers.add(selLayer);
  const dots = new atlas.layer.BubbleLayer(source, null, {
    color: ['get', 'color'], radius: ['get', 'radius'], strokeColor: ['get', 'stroke'], strokeWidth: 2,
    opacity: ['get', 'opacity'], strokeOpacity: ['get', 'opacity'], filter: isPoint
  });
  map.layers.add(dots);
  map.layers.add(new atlas.layer.SymbolLayer(source, null, {
    iconOptions: { image: 'none' },
    textOptions: { textField: ['get', 'label'], offset: [0, 1.8], color: '#ffffff', haloColor: '#000000', haloWidth: 1.5, size: 13 },
    filter: isPoint
  }));
  map.events.add('click', dots, e => select(e.shapes[0].getProperties().id));
  refresh();
  setInterval(refresh, 3000);
});

async function refresh() {
  try { data = await (await fetch('/api/state')).json(); } catch (e) { return; }
  if (!selectedId) selectedId = (data.points.find(p => p.live) || data.points[0]).id;
  drawMap();
  drawSummary();
  drawList();
  drawDetail();
}

function drawMap() {
  if (!source) return;
  const feats = [];
  data.points.forEach(p => {
    const nodata = p.no_data && !p.manual;
    feats.push(new atlas.data.Feature(new atlas.data.Point([p.lon, p.lat]), {
      id: p.id, outlook_level: p.outlook_level,
      color: nodata ? '#9aa3aa' : COLOR[p.level],
      stroke: p.level === 'none' || nodata ? '#1d2327' : '#ffffff',
      opacity: nodata ? 0.6 : 1,
      radius: p.level === 'red' ? 12 : p.level === 'yellow' ? 10 : 7,
      label: p.live ? `${p.id} live` : p.id
    }));
    if (p.alternative) {
      feats.push(new atlas.data.Feature(new atlas.data.LineString([[p.lon, p.lat], [p.alternative.lon, p.alternative.lat]]), {}));
    }
  });
  source.setShapes(feats);
  selLayer.setOptions({ filter: ['all', ['==', ['geometry-type'], 'Point'], ['==', ['get', 'id'], selectedId]] });
}

function drawSummary() {
  const red = data.points.filter(p => p.level === 'red');
  const yellow = data.points.filter(p => p.level === 'yellow');
  let text;
  if (!red.length && !yellow.length) text = `No anomaly measured at the ${data.points.length} water points.`;
  else {
    const parts = [];
    if (red.length) parts.push(`${red.length} water point${red.length > 1 ? 's' : ''} need${red.length > 1 ? '' : 's'} action`);
    if (yellow.length) parts.push(`${yellow.length} to watch`);
    text = parts.join(', ') + '.';
  }
  $('headline').textContent = text;

  const live = data.points.find(p => p.live);
  const st = $('station');
  if (live) {
    const fresh = !live.no_data && live.data_age_h != null && live.data_age_h <= 0.2;
    st.textContent = live.no_data ? `Station ${live.id} has not sent any data yet.`
      : fresh ? `Station ${live.id} is live: ${live.tds} mg/L salt.`
      : `Station ${live.id} last sent data ${ago(live.data_age_h)}.`;
    st.className = 'station' + (fresh ? '' : ' off');
  }
  $('updated').textContent = 'Updated ' + new Date(data.generated).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function drawList() {
  const list = data.points
    .filter(p => p.level !== 'none' || p.outlook_level === 'red')
    .sort((a, b) => RANK[b.level] - RANK[a.level] || b.people - a.people);
  const box = $('list');
  if (!list.length) box.replaceChildren(el('p', 'empty', 'Nothing needs attention right now.'));
  else box.replaceChildren(...list.map(p => {
    const row = el('button', 'row' + (p.id === selectedId ? ' sel' : ''));
    row.type = 'button';
    const mid = el('span');
    mid.append(el('b', null, `${p.id} ${p.name}`),
               el('span', 'why', p.level === 'none' ? (p.outlook[0] || {}).title || 'Likely to get worse' : p.reasons[0] || STATUS[p.level]));
    row.append(el('span', 'mark ' + (p.level === 'none' ? 'ring' : p.level)), mid, el('span', 'ppl', `${n(p.people)} people`));
    row.addEventListener('click', () => select(p.id));
    return row;
  }));
  $('next').replaceChildren();
  if (data.priorities.length) {
    $('next').append('Test next: ', el('b', null, data.priorities.map(t => `${t.id} ${t.name}`).join(', ')));
  }
}

function drawDetail() {
  const p = data.points.find(x => x.id === selectedId);
  if (!p) return;
  const nodata = p.no_data && !p.manual;
  const name = $('d-name');
  name.textContent = `${p.id} ${p.name}`;
  if (p.live) name.append(el('span', 'live', 'LIVE'));
  const st = $('d-status');
  st.className = 'status ' + (nodata ? 'none' : p.level);
  st.textContent = nodata ? 'No data' : STATUS[p.level] + (p.manual ? ' (set by hand)' : '');
  $('d-sub').textContent = `${p.source_type.replace('_', ' ')}, last data ${ago(p.data_age_h)}`;
  const tds = $('d-tds');
  tds.textContent = p.tds != null ? n(Math.round(p.tds)) + (p.salt_trend === 'rising' ? ' ↑' : '') : '–';
  tds.className = p.salt_trend === 'rising' ? 'rising' : '';
  $('d-germ').textContent = p.no_data ? '–' : `${Math.round(p.p_germs * 100)} %`;
  $('d-people').textContent = n(p.people);
  $('d-advice').replaceChildren(...p.advice.filter(t => !p.manual || !t.startsWith('No alternative')).slice(0, 3).map(t => el('li', null, t)));
  const alt = $('d-alt');
  alt.hidden = !p.alternative;
  if (p.alternative) alt.textContent = `Nearest other water point: ${p.alternative.id} ${p.alternative.name}, ${p.alternative.km} km.`;
  $('d-confirm').hidden = !p.live;
  loadChart(p.id);
}

let chartBusy = false;
async function loadChart(id) {
  if (chartBusy || typeof Chart === 'undefined') return;
  chartBusy = true;
  let h = null;
  try { h = await (await fetch(`/api/history?id=${id}&n=150`)).json(); } catch (e) {}
  chartBusy = false;
  if (!h || id !== selectedId) return;
  const pts = h.points || [];
  const labels = pts.map(p => new Date(p.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  const tds = pts.map(p => p.tds);
  const limit = (h.limits && h.limits.human) || 1000;
  const datasets = [
    { label: 'Salt', data: tds, borderColor: '#1d2327', pointRadius: 0, tension: 0.2, borderWidth: 2, fill: false },
    { label: `Drinking limit (${limit})`, data: tds.map(() => limit), borderColor: '#d1242f', borderDash: [5, 4], pointRadius: 0, borderWidth: 1.5, fill: false }
  ];
  const max = Math.max(...tds, limit) * 1.15;
  if (!chart) {
    chart = new Chart($('chart'), {
      type: 'line', data: { labels, datasets },
      options: {
        animation: false, responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { ticks: { color: '#5b6670', maxTicksLimit: 4, maxRotation: 0 }, grid: { display: false } },
          y: { min: 0, suggestedMax: max, ticks: { color: '#5b6670', maxTicksLimit: 4 }, grid: { color: '#eceff1' } }
        },
        plugins: { legend: { align: 'start', labels: { color: '#1d2327', boxWidth: 14, boxHeight: 1, font: { size: 12 } } } }
      }
    });
  } else {
    chart.data.labels = labels; chart.data.datasets = datasets;
    chart.options.scales.y.suggestedMax = max;
    chart.update();
  }
}

function select(id) {
  if (id !== selectedId) $('d-msg').textContent = '';
  selectedId = id;
  if (data) { drawMap(); drawList(); drawDetail(); }
}

document.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', async () => {
  await post('/api/override', { point_id: selectedId, level: b.dataset.level });
  $('d-msg').textContent = `${selectedId} marked as ${STATUS[b.dataset.level].toLowerCase()}. No SMS is sent for this.`;
  refresh();
}));

try { $('d-by').value = localStorage.getItem('wendy-by') || ''; } catch (e) {}
$('d-reset').addEventListener('click', async () => {
  const p = data && data.points.find(x => x.id === selectedId);
  const msg = $('d-msg');
  if (!p) return;
  const by = $('d-by').value.trim();
  if (p.live && (!by || !$('d-checked').checked)) { msg.textContent = 'Enter your name and tick the box first.'; return; }
  msg.textContent = 'Resetting…';
  try {
    // first the cloud (this may send the station a fresh verdict), then the station's lights
    await post('/api/clear', { point_id: p.id });
    if (p.live) {
      try { localStorage.setItem('wendy-by', by); } catch (e) {}
      const res = await post('/api/reset', { point_id: p.id, by, checked: true });
      const body = await res.json();
      if (!res.ok) { msg.textContent = body.error || 'The station could not be reset. Try again.'; refresh(); return; }
      $('d-checked').checked = false;
      msg.textContent = `Reset by ${body.by}. The lights at ${p.id} go off within seconds and come back if the water is still salty or dirty.`;
    } else {
      msg.textContent = `${p.id} reset to the measured values.`;
    }
  } catch (e) { msg.textContent = 'No connection to the server. Try again.'; }
  refresh();
});

$('reset-all').addEventListener('click', async () => {
  await post('/api/clear', { point_id: 'all' });
  $('d-msg').textContent = 'All points reset to the measured values.';
  refresh();
});
</script>
</body>
</html>
