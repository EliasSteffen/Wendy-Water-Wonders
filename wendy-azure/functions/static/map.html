<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wendy's Early Signal</title>
<link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css">
<script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#10161a; --panel:#182128; --fg:#e8eef0; --muted:#93a3ab; --line:#2a363e;
          --none:#2563eb; --yellow:#eab308; --red:#dc2626; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
               font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  .app { display: grid; grid-template-columns: 1fr 360px; height: 100%; }
  #map { width: 100%; height: 100%; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
          padding: 16px; display: grid; gap: 18px; align-content: start; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  ol, ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
  .alert { border-left: 4px solid var(--red); padding: 6px 10px; background: #0003; border-radius: 4px; margin-bottom: 8px; }
  .alert.yellow { border-color: var(--yellow); }
  .alert b { display: block; }
  .alert small { color: var(--muted); display: block; margin-top: 2px; }
  .muted { color: var(--muted); }
  form, .buttons { display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  select, button { font: inherit; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--line);
                   background: #0d1317; color: var(--fg); }
  button { cursor: pointer; background: #22313a; }
  button:hover { background: #2c3f4a; }
  .weather { font-size: 13px; color: var(--muted); }
  .trendhead { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .trendnow { font-size: 13px; font-weight: 600; }
  .trendnow.up { color: var(--red); }
  .chartbox { position: relative; height: 210px; }
  .ring { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #f97316; margin-right: 4px; vertical-align: -2px; }
  .strip { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-bottom: 10px; }
  .day { display: grid; grid-template-rows: auto 46px auto auto; justify-items: center; font-size: 10px; color: var(--muted); }
  .day .bar { align-self: end; width: 70%; background: #38bdf8; border-radius: 2px 2px 0 0; min-height: 1px; }
  .day .mm { color: var(--fg); }
  .day.hot .t { color: #f97316; font-weight: 600; }
  .outlook { border-left: 4px dashed #f97316; padding: 6px 10px; background: #0003; border-radius: 4px; margin-bottom: 8px; }
  .outlook.yellow { border-left-color: var(--yellow); }
  .outlook small { color: var(--muted); display: block; margin-top: 2px; }
  .src { font-size: 11px; color: var(--muted); }
  .buttons.grid2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } }
</style>
</head>
<body>
<div class="app">
  <div id="map"></div>
  <aside>
    <div>
      <h1>Wendy's Early Signal</h1>
      <div class="legend">
        <span><span class="dot" style="background:var(--none)"></span>no anomaly measured</span>
        <span><span class="dot" style="background:var(--yellow)"></span>watch / test</span>
        <span><span class="dot" style="background:var(--red)"></span>warning</span>
        <span><span class="ring"></span>getting worse soon</span>
      </div>
    </div>
    <section><h2>Test today</h2><ol id="prio"><li class="muted">loading…</li></ol></section>
    <section><h2>Alerts</h2><div id="alerts" class="muted">loading…</div></section>
    <section>
      <h2>Salt trend</h2>
      <div class="trendhead">
        <select id="h-point" aria-label="Water point for salt trend"></select>
        <span id="h-now" class="trendnow muted">–</span>
      </div>
      <div class="chartbox"><canvas id="h-chart"></canvas></div>
    </section>
    <section>
      <h2>Outlook · next 10 days</h2>
      <div id="strip" class="strip"></div>
      <div id="outlooks" class="muted">loading…</div>
      <div id="fcsrc" class="src"></div>
    </section>
    <section><h2>Weather (Lodwar)</h2><div id="weather" class="weather">–</div></section>
    <section>
      <h2>Report test result</h2>
      <form id="testform">
        <div class="row">
          <select id="t-point" aria-label="Water point"></select>
          <select id="t-test" aria-label="Test">
            <option value="h2s">H2S strip</option><option value="cbt">Bag test</option><option value="salt_kit">Salt kit</option>
          </select>
          <select id="t-result" aria-label="Result">
            <option value="positive">positive</option><option value="negative">negative</option>
          </select>
        </div>
        <button type="submit">Send result</button>
      </form>
    </section>
    <section>
      <h2>Demo weather</h2>
      <div class="buttons grid2">
        <button data-preset="heavy_rain">Heavy rain</button>
        <button data-preset="forecast">Rain forecast</button>
        <button data-preset="dry">Dry &amp; hot</button>
        <button data-preset="reset">Real weather</button>
      </div>
      <div class="buttons" style="margin-top:8px"><button id="clouds">Show clouds (satellite)</button></div>
    </section>
  </aside>
</div>
<script>
const COLORS = { none: '#2563eb', yellow: '#eab308', red: '#dc2626' };
const map = new atlas.Map('map', {
  center: [35.62, 3.13], zoom: 9.3, style: 'satellite_road_labels',
  authOptions: { authType: 'subscriptionKey', subscriptionKey: '__MAPS_KEY__' }
});
let source, popup, filledSelect = false;

map.events.add('ready', () => {
  source = new atlas.source.DataSource();
  map.sources.add(source);
  map.layers.add(new atlas.layer.LineLayer(source, null, {
    strokeColor: '#ffffff', strokeWidth: 3, strokeDashArray: [2, 2],
    filter: ['==', ['geometry-type'], 'LineString']
  }));
  map.layers.add(new atlas.layer.BubbleLayer(source, null, {
    color: 'rgba(0,0,0,0)', radius: 19, strokeWidth: 3,
    strokeColor: ['match', ['get', 'outlook_level'], 'red', '#f97316', 'yellow', '#eab308', 'rgba(0,0,0,0)'],
    filter: ['all', ['==', ['geometry-type'], 'Point'], ['!=', ['get', 'outlook_level'], 'none']]
  }));
  const bubbles = new atlas.layer.BubbleLayer(source, null, {
    color: ['get', 'color'], radius: ['get', 'radius'], strokeColor: '#ffffff', strokeWidth: 2,
    filter: ['==', ['geometry-type'], 'Point']
  });
  map.layers.add(bubbles);
  map.layers.add(new atlas.layer.SymbolLayer(source, null, {
    iconOptions: { image: 'none' },
    textOptions: { textField: ['get', 'label'], offset: [0, 1.8], color: '#ffffff', haloColor: '#000000', haloWidth: 1.5, size: 12 },
    filter: ['==', ['geometry-type'], 'Point']
  }));
  popup = new atlas.Popup({ pixelOffset: [0, -14] });
  map.events.add('click', bubbles, e => {
    const p = e.shapes[0].getProperties();
    const div = document.createElement('div');
    div.style.cssText = 'padding:10px;max-width:260px;color:#111;font:13px Segoe UI,sans-serif';
    const lines = [
      `${p.id} ${p.name}`,
      `Salt: ${p.salt} (~${p.tds ?? '–'} mg/L) · Germ risk: ${Math.round(p.p_germs * 100)} %`,
      ...p.reasons, ...p.advice,
      ...(p.outlook || []).map(o => `Outlook: ${o.message}`),
      p.data_age_h != null ? `Data age: ${p.data_age_h} h` : 'No data yet'
    ];
    lines.forEach((t, i) => { const el = document.createElement(i ? 'div' : 'b'); el.textContent = t; div.appendChild(el); });
    popup.setOptions({ content: div, position: e.shapes[0].getCoordinates() });
    popup.open(map);
    selectPoint(p.id);
  });
  refresh();
  setInterval(refresh, 3000);
});

async function refresh() {
  let data;
  try { data = await (await fetch('/api/state')).json(); } catch (e) { return; }
  const feats = [];
  data.points.forEach(p => {
    feats.push(new atlas.data.Feature(new atlas.data.Point([p.lon, p.lat]), {
      ...p, color: p.no_data ? '#6b7280' : COLORS[p.level],
      radius: p.level === 'red' ? 13 : 9, label: p.id
    }));
    if (p.alternative) {
      feats.push(new atlas.data.Feature(new atlas.data.LineString([[p.lon, p.lat], [p.alternative.lon, p.alternative.lat]]), {}));
    }
  });
  source.setShapes(feats);
  renderPanel(data);
  loadHistory();
}

// ------------------------------------------------------------- outlook --
function renderOutlook(data) {
  const fc = (data.weather && data.weather.forecast) || [];
  const strip = document.getElementById('strip');
  const maxRain = Math.max(20, ...fc.map(d => d.rain_mm || 0));
  strip.replaceChildren(...fc.slice(0, 10).map(d => {
    const el = document.createElement('div');
    el.className = 'day' + ((d.tmax || 0) >= 36 ? ' hot' : '');
    const wd = document.createElement('span');
    wd.textContent = new Date(d.date + 'T12:00:00').toLocaleDateString([], { weekday: 'short' });
    const bar = document.createElement('div');
    bar.className = 'bar'; bar.style.height = `${Math.round(46 * (d.rain_mm || 0) / maxRain)}px`;
    const mm = document.createElement('span'); mm.className = 'mm'; mm.textContent = `${Math.round(d.rain_mm || 0)}mm`;
    const t = document.createElement('span'); t.className = 't'; t.textContent = d.tmax != null ? `${Math.round(d.tmax)}°` : '–';
    el.append(wd, bar, mm, t);
    return el;
  }));

  const box = document.getElementById('outlooks');
  const items = [];
  data.points.forEach(p => (p.outlook || []).forEach(o => items.push({ p, o })));
  items.sort((a, b) => (b.o.level === 'red') - (a.o.level === 'red'));
  if (!fc.length) box.textContent = 'No forecast yet.';
  else if (!items.length) box.textContent = 'Nothing expected to get worse.';
  else box.replaceChildren(...items.slice(0, 6).map(({ p, o }) => {
    const d = document.createElement('div');
    d.className = 'outlook ' + o.level;
    const b = document.createElement('b'); b.textContent = `${p.id} ${p.name} · ${o.title}`; d.appendChild(b);
    const m = document.createElement('div'); m.textContent = o.message; d.appendChild(m);
    const s = document.createElement('small'); s.textContent = o.drivers.join(' · '); d.appendChild(s);
    return d;
  }));
  const w = data.weather || {};
  document.getElementById('fcsrc').textContent =
    fc.length ? `Forecast: ${w.source && w.source.startsWith('demo') ? 'demo scenario' : (w.forecast_source || 'unknown')}` : '';
}

let cloudLayer = null;
document.getElementById('clouds').addEventListener('click', e => {
  if (!cloudLayer) {
    cloudLayer = new atlas.layer.TileLayer({
      tileUrl: 'https://{azMapsDomain}/map/tile?api-version=2.0&tilesetId=microsoft.weather.infrared.main&zoom={z}&x={x}&y={y}&tileSize=256',
      opacity: 0.55, tileSize: 256, maxSourceZoom: 15
    }, 'clouds');
    try { map.layers.add(cloudLayer, 'labels'); } catch (err) { map.layers.add(cloudLayer); }
    e.target.textContent = 'Hide clouds';
  } else {
    map.layers.remove(cloudLayer); cloudLayer = null;
    e.target.textContent = 'Show clouds (satellite)';
  }
});

// ---------------------------------------------------------- salt trend --
let selectedId = null, chart = null;

function selectPoint(id) {
  selectedId = id;
  document.getElementById('h-point').value = id;
  loadHistory();
}

async function loadHistory() {
  if (!selectedId || typeof Chart === 'undefined') return;
  let h;
  try { h = await (await fetch(`/api/history?id=${selectedId}&n=150`)).json(); } catch (e) { return; }
  const now = document.getElementById('h-now');
  if (!h.points || !h.points.length) { now.textContent = 'no data yet'; now.className = 'trendnow muted'; return; }

  const labels = h.points.map(p => new Date(p.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
  const tds = h.points.map(p => p.tds);
  const last = tds[tds.length - 1];
  const early = tds.slice(0, Math.max(1, Math.min(10, Math.floor(tds.length / 3))));
  const earlyMean = early.reduce((a, b) => a + b, 0) / early.length;
  const rising = tds.length >= 6 && last > 1.1 * earlyMean;
  now.textContent = `${last} mg/L · ${rising ? 'rising ▲' : 'stable'}`;
  now.className = 'trendnow' + (rising ? ' up' : '');

  const maxV = Math.max(...tds, h.limits.human) * 1.15;
  const flat = v => tds.map(() => v);
  const datasets = [
    { label: 'Salt (TDS mg/L)', data: tds, borderColor: '#38bdf8', backgroundColor: 'rgba(56,189,248,0.15)',
      fill: true, pointRadius: 0, tension: 0.25, borderWidth: 2 },
    { label: `People limit ${h.limits.human}`, data: flat(h.limits.human), borderColor: '#f87171',
      borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5, fill: false }
  ];
  if (maxV > h.limits.livestock * 0.6) {
    datasets.push({ label: `Livestock limit ${h.limits.livestock}`, data: flat(h.limits.livestock), borderColor: '#fb923c',
      borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5, fill: false });
  }

  if (!chart) {
    chart = new Chart(document.getElementById('h-chart'), {
      type: 'line',
      data: { labels, datasets },
      options: {
        animation: false, responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { ticks: { color: '#93a3ab', maxTicksLimit: 5, maxRotation: 0 }, grid: { color: '#2a363e' } },
          y: { min: 0, suggestedMax: maxV, ticks: { color: '#93a3ab' }, grid: { color: '#2a363e' },
               title: { display: true, text: 'mg/L', color: '#93a3ab' } }
        },
        plugins: { legend: { labels: { color: '#e8eef0', boxWidth: 12, font: { size: 11 } } } }
      }
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets = datasets;
    chart.options.scales.y.suggestedMax = maxV;
    chart.update();
  }
}

document.getElementById('h-point').addEventListener('change', e => selectPoint(e.target.value));

function renderPanel(data) {
  const prio = document.getElementById('prio');
  prio.replaceChildren(...data.priorities.map(t => {
    const li = document.createElement('li');
    li.textContent = `${t.id} ${t.name} · risk ${Math.round(t.p_germs * 100)} % · ${t.people} people · ${t.why}`;
    return li;
  }));

  const alerts = document.getElementById('alerts');
  const list = data.points.filter(p => p.level !== 'none').sort((a, b) => (b.level === 'red') - (a.level === 'red'));
  if (!list.length) { alerts.textContent = 'No anomalies measured.'; }
  else alerts.replaceChildren(...list.map(p => {
    const d = document.createElement('div');
    d.className = 'alert ' + p.level;
    const b = document.createElement('b'); b.textContent = `${p.id} ${p.name}`; d.appendChild(b);
    const s = document.createElement('div'); s.textContent = p.reasons.join(' · '); d.appendChild(s);
    const a = document.createElement('small');
    a.textContent = p.advice.join(' ') + (p.alternative ? ` → ${p.alternative.id} ${p.alternative.name} (${p.alternative.km} km)` : '');
    d.appendChild(a);
    return d;
  }));

  renderOutlook(data);
  const w = data.weather || {};
  document.getElementById('weather').textContent =
    `Rain last 72 h: ${w.rain_72h ?? '–'} mm · dry days: ${w.dry_days ?? '–'} · forecast 48 h: ${w.rain_forecast_48h ?? '–'} mm` +
    (w.source && w.source.startsWith('demo') ? ' (demo override)' : '');

  if (!filledSelect) {
    const sel = document.getElementById('t-point');
    const hsel = document.getElementById('h-point');
    data.points.forEach(p => {
      for (const s of [sel, hsel]) {
        const o = document.createElement('option'); o.value = p.id; o.textContent = `${p.id} ${p.name}`; s.appendChild(o);
      }
    });
    filledSelect = true;
    const firstSalty = data.points.find(p => p.salt === 'red');
    selectPoint((data.points.find(p => p.id === 'wp07') || firstSalty || data.points[0]).id);
  }
}

document.getElementById('testform').addEventListener('submit', async e => {
  e.preventDefault();
  await fetch('/api/testresult', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ point_id: document.getElementById('t-point').value,
                           test: document.getElementById('t-test').value,
                           result: document.getElementById('t-result').value }) });
  refresh();
});
document.querySelectorAll('[data-preset]').forEach(btn => btn.addEventListener('click', async () => {
  await fetch('/api/simulate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ preset: btn.dataset.preset }) });
  refresh();
}));
</script>
</body>
</html>
