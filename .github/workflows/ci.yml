name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Pi and the Azure Function
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci                        # npm workspaces: animations/ and frontend/
      - run: npm run typecheck --workspace animations
      - run: npm run typecheck --workspace frontend
      - run: npm run build --workspace frontend
