name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Pi and the Azure Function
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  animations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: animations/package-lock.json
      - run: npm ci
      - run: npm run typecheck
